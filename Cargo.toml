[package]
name = "rls2fga"
version = "0.1.0"
edition = "2021"
description = "Translate PostgreSQL RLS policies into OpenFGA authorization models"
readme = "README.md"

[features]
default = ["std"]
# Re-enables the standard library: the file-writing `output::formatter`
# module and `Translator::write_output`. Also forwards `std`/stack-overflow
# protection to the parser dependencies. Disable for a `no_std` + `alloc`
# build of the parse/classify/generate pipeline.
std = ["sqlparser/std", "sqlparser/recursive-protection", "sql-traits/std", "serde/std", "serde_json/std"]
agent = ["std", "reqwest", "tokio"]
db = ["std", "diesel"]

[dependencies]
sqlparser = { version = "0.62", default-features = false, features = ["serde", "visitor"] }
sql-traits = { git = "https://github.com/earth-metabolome-initiative/sql-traits", rev = "37a76a0", default-features = false }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

# Optional
reqwest = { version = "0.13", features = ["json"], optional = true }
tokio = { version = "1", features = ["full"], optional = true }
diesel = { version = "2", features = ["postgres", "serde_json"], optional = true }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
insta = { version = "1", features = ["json"] }
testcontainers = "0.27"
tokio = { version = "1", features = ["full"] }

# openfga-client pulls in protobuf-src which fails to link on Windows MSVC
# (abseil-cpp CRT mismatch). Only needed for Docker integration tests on Linux/macOS.
[target.'cfg(not(target_os = "windows"))'.dev-dependencies]
openfga-client = "0.6"

[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
unused_qualifications = "warn"
deprecated = "deny"

[lints.clippy]
# Correctness & restriction
correctness = { level = "deny", priority = -1 }
enum_glob_use = "deny"
self_named_module_files = "deny"
# Style
style = { level = "warn", priority = -1 }
cloned_instead_of_copied = "warn"
doc_markdown = "warn"
explicit_into_iter_loop = "warn"
explicit_iter_loop = "warn"
flat_map_option = "warn"
implicit_clone = "warn"
inconsistent_struct_constructor = "warn"
manual_let_else = "warn"
manual_ok_or = "warn"
manual_string_new = "warn"
map_unwrap_or = "warn"
needless_pass_by_value = "warn"
redundant_closure_for_method_calls = "warn"
redundant_else = "warn"
semicolon_if_nothing_returned = "warn"
unnested_or_patterns = "warn"
unused_self = "warn"
# Perf
large_enum_variant = "warn"
needless_collect = "warn"
unnecessary_box_returns = "warn"
# Pedantic (selected)
pedantic = { level = "warn", priority = -1 }
# Pedantic overrides — too noisy or not applicable
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
wildcard_imports = "allow"

[[bench]]
name = "records"
harness = false

# Pin sqlparser (and every dependent: sql-traits, sql_docs) to datafusion-sqlparser-rs
# main. The published 0.62.0 release declares `#![no_std]` but its body still references
# `std::` in roughly 3200 spots, so it fails to compile without the standard library.
# The complete no_std hygiene exists only on main (this rev), which our no_std + alloc
# and wasm builds require. The default std build compiles fine against crates.io 0.62.0,
# so this patch is only load-bearing for no_std. It is also why the crate cannot be
# published on crates.io (git deps are forbidden) until sqlparser ships a release above
# 0.62.0 carrying the no_std fixes.
[patch.crates-io]
sqlparser = { git = "https://github.com/apache/datafusion-sqlparser-rs", rev = "2f3b5b824c24304720f1e8e504f54b9910e63bad" }

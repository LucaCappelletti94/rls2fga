name: Runtime Parity

on:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly runtime parity sweep every Tuesday at 04:17 UTC.
    - cron: "17 4 * * 2"

concurrency:
  group: runtime-parity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  runtime-parity:
    name: runtime-parity
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Verify Docker availability
        run: docker version

      - name: Run runtime integration suites
        run: cargo test --locked --lib --tests

      - name: Run ignored runtime integration suites
        run: cargo test --locked --tests -- --ignored
